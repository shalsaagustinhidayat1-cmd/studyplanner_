<style>

#ov .mb{position:fixed;inset:0;background:rgba(10,20,40,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}

ul.t{padding-left:18px;margin:0}ul.t li{margin-bottom:5px}

const A={close:close_,sel:v=>{C.d=v;render()},cv:v=>{C.v=v;render()},cn:v=>{const n=+v,d=dt(C.d);if(C.v==='month')d.setMonth(d.getMonth()+n,1);else d.setDate(d.getDate()+n*(C.v==='week'?7:1));C.d=ymd(d);render()},ct:()=>{C.d=today();render()},

async function hs(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

{let s=null;try{s=localStorage.getItem(SK)}catch(e){}const us=rd(UK,{});if(s&&us[s])enter(s);else authUI(!Object.keys(us).length)}
